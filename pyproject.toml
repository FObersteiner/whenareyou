[project]
name = "whenareyou"
version = "0.7.2"
description = "Gets the time zone name of any location in the world."
authors = [
  { name = "Florian Obersteiner", email = "f.obersteiner@posteo.de" },
  { name = "Lasse Schuirmann", email = "lasse.schuirmann@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = ["timezonefinder>=6.0.0"]

[dependency-groups]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
lint.ignore = ["E501"]
lint.extend-select = ["C4", "SIM"]
line-length = 100
fix = true
exclude = ["tests"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
